<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To eDo List</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<button type="button"  id="triggerTodoModal">Add Todo</button>
<dialog id="newTodoTrigger">
    <form action="" id="todoForm">
        <button type="button" id="closeModal">Cancel</button>
        <label for="todoTitle">Todo Title</label>
        <input type="text" id="todoTitle" name="todoTitle">
        <label for="todoDescription">Description</label>
        <input type="text" name="todoDescription" id="todoDescription">
        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" name="dueDate">
        <label for="selectPriority">Priority</label>
        <select name="selectPriority" id="selectPriority">
            <option value="">Select</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <label for="todoNotes">Notes:</label>
        <textarea name="todoNotes" id="todoNotes"></textarea>
        <button type="submit">Save</button>
    </form>
</dialog>
<div id="todo-list-container">
</div>
</body>
</html>
